<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b0a">
<title>Agenda da Cena · Gestão da banda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* mesmo visual escuro da apresentação e do protótipo do público */
  :root {
    color-scheme: dark;
    --bg: #0c0b0a;
    --bg-2: #161412;
    --card: #1d1a17;
    --card-2: #25211d;
    --line: #322d28;
    --text: #f1ece4;
    --muted: #a39a8e;
    --accent: #e63b2e;
    --accent-soft: rgba(230, 59, 46, .16);
    --warn: #f2b33d;
    --warn-soft: rgba(242, 179, 61, .14);
    --ok: #57c27a;
    --ok-soft: rgba(87, 194, 122, .14);
    --display: "Archivo Black", "Arial Black", Impact, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Space Mono", ui-monospace, Menlo, monospace;
    --nav-w: 260px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  a { color: inherit; }

  /* ---------- estrutura ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    background: rgba(12, 11, 10, .9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: inline-flex; align-items: center; gap: .6em; min-width: 0; }
  .brand .logo {
    width: 26px; height: 26px; border-radius: 50%; background: var(--accent); flex: none;
    display: grid; place-items: center; font-family: var(--display); font-size: 12px; color: #fff;
  }
  .brand b { font-family: var(--display); font-size: 13px; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
  .tag {
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .08em;
    background: var(--accent); color: #fff; border-radius: 4px; padding: .15em .45em;
  }
  .me-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #3a1512, #e63b2e); display: grid; place-items: center;
    font-family: var(--display); font-size: 12px; color: #fff;
  }

  main { max-width: 920px; margin: 0 auto; padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0px)); }

  .tabs {
    position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--bg-2); border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tabs a {
    display: grid; justify-items: center; gap: 2px; padding: 6px 4px; border-radius: 10px;
    text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 600;
  }
  .tabs a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabs a.on { color: var(--text); }
  .tabs a.new svg { background: var(--accent); stroke: #fff; border-radius: 8px; padding: 3px; width: 30px; height: 26px; }
  .tabs .side-only { display: none; }

  @media (min-width: 900px) {
    .topbar { padding-left: calc(var(--nav-w) + 24px); }
    .topbar .brand { display: none; }
    main { margin-left: var(--nav-w); margin-right: 0; padding: 28px 36px 48px; max-width: 980px; }
    .tabs {
      top: 0; right: auto; width: var(--nav-w); bottom: 0;
      display: flex; flex-direction: column; gap: 4px;
      border-top: 0; border-right: 1px solid var(--line); padding: 18px 12px;
    }
    .tabs .side-only { display: flex; }
    .tabs .side-brand { padding: 0 8px 18px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
    .tabs a { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 10px 10px; justify-items: start; }
    .tabs a:hover { background: var(--card); }
    .tabs a.on { background: var(--card); }
    .tabs a.new { margin-top: 6px; background: var(--accent); color: #fff; justify-content: center; }
    .tabs a.new svg { background: none; padding: 0; width: 20px; height: 20px; }
    .tabs .foot { margin-top: auto; padding: 10px; color: var(--muted); font-family: var(--mono); font-size: 11px; }
  }

  /* ---------- peças ---------- */
  .kicker { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); margin-bottom: 6px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 4vw, 34px); line-height: 1.05; text-transform: uppercase; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 17px; text-transform: uppercase; margin: 26px 0 10px; }
  .sub { color: var(--muted); margin-top: 6px; }
  .sub b { color: var(--text); font-weight: 600; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .grid-2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 700px) { .grid-2 { grid-template-columns: 1fr 1fr; } }

  .pill {
    display: inline-flex; align-items: center; gap: .35em;
    font-family: var(--mono); font-size: 12px; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 999px; padding: .3em .8em; color: var(--muted);
  }
  button.pill:hover { border-color: var(--muted); color: var(--text); }
  .pill.on { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 700; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill.red { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .badge { font-size: 11px; font-weight: 700; border-radius: 6px; padding: .12em .5em; white-space: nowrap; }
  .badge.ok { background: var(--ok); color: #0c0b0a; }
  .badge.warn { background: var(--warn); color: #0c0b0a; }
  .badge.red { background: var(--accent); color: #fff; }
  .badge.draft { background: var(--card-2); color: var(--muted); border: 1px solid var(--line); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 10px; padding: 10px 16px; font-weight: 700; text-decoration: none;
    border: 1px solid var(--line); background: var(--card);
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .btn.small { padding: 6px 12px; font-size: 13px; }

  /* lista de eventos */
  .ev {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center;
    width: 100%; text-align: left; text-decoration: none;
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--ok);
    border-radius: 12px; padding: 12px 12px 12px 10px; margin-bottom: 10px;
  }
  a.ev:hover { background: var(--card-2); }
  .ev.s-local, .ev.s-adiado { border-left-color: var(--warn); }
  .ev.s-cancelado { border-left-color: var(--accent); opacity: .75; }
  .ev.s-rascunho { border-left-color: var(--line); border-style: dashed; border-left-style: solid; }
  .ev .date { text-align: center; line-height: 1; }
  .ev .date small { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .ev .date b { font-family: var(--display); font-size: 24px; display: block; margin-top: 3px; }
  .ev .t { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ev .w { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chev { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }

  .free-days { display: flex; gap: 8px; flex-wrap: wrap; }

  /* calendário */
  .cal-wrap { display: grid; gap: 16px; }
  @media (min-width: 900px) { .cal-wrap { grid-template-columns: 1.3fr 1fr; align-items: start; } }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  .cal .dow { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 2px; }
  .cal .day {
    aspect-ratio: 1 / .9; border-radius: 8px; background: var(--card); border: 1px solid var(--line);
    padding: 4px 6px; font-family: var(--mono); font-size: 12px; text-align: left;
    display: flex; flex-direction: column; justify-content: space-between; position: relative;
  }
  .cal .day:hover { border-color: var(--muted); }
  .cal .day.empty { background: transparent; border-color: transparent; pointer-events: none; }
  .cal .day.past { opacity: .4; }
  .cal .day .dots { display: flex; gap: 3px; flex-wrap: wrap; }
  .cal .day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); display: block; }
  .cal .day.h1 { background: rgba(230,59,46,.10); }
  .cal .day.h2 { background: rgba(230,59,46,.22); border-color: rgba(230,59,46,.35); }
  .cal .day.h3 { background: rgba(230,59,46,.38); border-color: var(--accent); }
  .cal .day.mine::after {
    content: "♪"; position: absolute; top: 3px; right: 5px; font-size: 11px; color: var(--ok);
  }
  .cal .day.today { box-shadow: inset 0 0 0 1px var(--text); }
  .cal .day.sel { outline: 2px solid var(--text); outline-offset: 1px; }
  .legend { display: flex; gap: 1em; flex-wrap: wrap; margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .legend span::before {
    content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px;
    background: var(--c);
  }
  .legend .mine-l::before { content: "♪"; background: none; color: var(--ok); width: auto; height: auto; margin-right: 4px; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); }
  .icon-btn:hover { border-color: var(--muted); }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .icon-btn svg { width: 18px; height: 18px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mini { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .mini:last-child { border-bottom: 0; }
  .mini b { font-weight: 700; }
  .mini span { color: var(--muted); font-size: 13px; }
  .mini .km { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }

  /* formulário */
  .form-wrap { display: grid; gap: 16px; }
  @media (min-width: 900px) { .form-wrap { grid-template-columns: 1.4fr 1fr; align-items: start; } .side-sticky { position: sticky; top: 80px; } }
  .field { margin-bottom: 14px; }
  .field label { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 5px; }
  .field label i { color: var(--accent); font-style: normal; }
  .input {
    width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; outline: none;
  }
  .input:focus { border-color: var(--text); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .minimap { height: 160px; border-radius: 10px; border: 1px solid var(--line); margin: 8px 0; background: var(--bg-2); }
  .addr { font-size: 13px; color: var(--muted); }
  .lineup-edit { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .lineup-edit .pill { color: var(--text); }
  .lineup-edit .pill.linked::after { content: " ↗"; color: var(--accent); }
  .lineup-edit .pill button { color: var(--muted); padding-left: 4px; }
  .lineup-edit .pill button:hover { color: var(--accent); }
  .add-row { display: flex; gap: 8px; }
  .add-row .input { flex: 1; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .flyer-drop {
    border: 1px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center; color: var(--muted); font-size: 13px; width: 100%;
  }
  .flyer-drop:hover { border-color: var(--muted); color: var(--text); }

  .alert { border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .alert.warn { background: var(--warn-soft); border: 1px solid rgba(242,179,61,.45); }
  .alert.warn > b { color: var(--warn); }
  .alert.ok { background: var(--ok-soft); border: 1px solid rgba(87,194,122,.4); }
  .alert.ok > b { color: var(--ok); }
  .alert ul { list-style: none; margin: 8px 0 10px; display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
  .alert ul b { color: var(--text); font-weight: 600; }
  .alert .alts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .alert .alts button.pill.ok:hover { border-color: var(--ok); }

  .checklist { list-style: none; display: grid; gap: 6px; margin: 8px 0 14px; font-size: 14px; }
  .checklist li { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .checklist li::before {
    content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none;
  }
  .checklist li.done { color: var(--text); }
  .checklist li.done::before { background: var(--ok); border-color: var(--ok); }

  /* página do evento */
  .ev-flyer {
    height: 150px; border-radius: 14px; margin-bottom: 12px;
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,.18) 0 6px, transparent 6px 14px),
      linear-gradient(135deg, #3a1512, #e63b2e);
    display: flex; align-items: flex-end; padding: 14px 16px;
    font-family: var(--display); font-size: 28px; text-transform: uppercase; line-height: 1;
  }
  .ev-flyer.cancelado { filter: grayscale(1) brightness(.6); }
  .status-banner { border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600; font-size: 14px; }
  .status-banner.warn { background: var(--warn); color: #1b1305; }
  .status-banner.red { background: var(--accent); color: #fff; }
  .status-banner .mono { font-weight: 700; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 4px 0 12px; }
  .kv dt { color: var(--muted); font-family: var(--mono); font-size: 13px; }
  .kv dd s { color: var(--muted); }
  .lineup { display: flex; flex-wrap: wrap; gap: 6px; }
  .lineup .pill { color: var(--text); }
  .lineup .pill.linked::after { content: " ↗"; color: var(--accent); }
  .status-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 600px) { .status-btns { grid-template-columns: repeat(4, 1fr); } }
  .status-btns button {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; font-weight: 600; font-size: 13.5px; background: var(--card);
  }
  .status-btns button:hover { border-color: var(--muted); }
  .status-btns button.on.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .status-btns button.on.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .status-btns button.on.red { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .change-box { margin-top: 12px; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; }
  .history { list-style: none; display: grid; gap: 8px; font-size: 13.5px; }
  .history li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; }
  .history li span { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .linkbox {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: var(--bg-2); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px 8px 12px;
    font-family: var(--mono); font-size: 13px; margin-bottom: 12px;
  }
  .linkbox span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wa {
    background: #0b141a; border-radius: 12px; padding: 10px; max-width: 340px;
  }
  .wa .bubble { background: #005c4b; border-radius: 10px; padding: 6px; font-size: 13px; }
  .wa .prev { background: rgba(0,0,0,.25); border-radius: 8px; overflow: hidden; margin-bottom: 6px; }
  .wa .prev .img { height: 70px; background: repeating-linear-gradient(135deg, rgba(0,0,0,.18) 0 6px, transparent 6px 14px), linear-gradient(135deg, #3a1512, #e63b2e); }
  .wa .prev div { padding: 6px 8px; }
  .wa .prev b { display: block; font-size: 13px; }
  .wa .prev small { color: #b6c2c9; font-size: 11.5px; }
  .wa .url { color: #53bdeb; font-size: 12.5px; }

  .repost { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 14px; font-size: 14px; }
  .story-row { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; margin-top: 14px; }
  .story {
    aspect-ratio: 9 / 16; border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
    background: repeating-linear-gradient(135deg, rgba(0,0,0,.18) 0 6px, transparent 6px 14px), linear-gradient(160deg, #3a1512, #e63b2e);
    font-size: 9px; line-height: 1.25;
  }
  .story.cancelado { filter: grayscale(1) brightness(.7); }
  .story b { font-family: var(--display); font-weight: 400; font-size: 12px; text-transform: uppercase; line-height: 1.05; }
  .story .s-tag { align-self: flex-start; background: var(--warn); color: #1b1305; font-family: var(--mono); font-weight: 700; font-size: 7.5px; padding: 1px 4px; border-radius: 3px; margin-bottom: auto; }

  /* perfil */
  .profile-head { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
  .profile-head .avatar { width: 72px; height: 72px; font-size: 24px; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }

  .toast {
    position: fixed; z-index: 40; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px);
    transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); font-weight: 600; font-size: 13px;
    border-radius: 999px; padding: .5em 1em; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 520px) { .topbar .pill { display: none; } }
  /* aviso de choque: embaixo da data no celular, na lateral no computador */
  #clash-inline { display: block; }
  #clash { display: none; }
  @media (min-width: 900px) { #clash-inline { display: none; } #clash { display: block; } }
  @media (min-width: 900px) { .toast { left: calc(50% + var(--nav-w) / 2); } }
  .leaflet-container { background: var(--bg-2); font-family: var(--body); }
  .leaflet-control-attribution { background: rgba(12,11,10,.7) !important; color: var(--muted) !important; font-size: 9px; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  .vpin { width: 22px; height: 22px; border-radius: 50% 50% 50% 3px; transform: rotate(-45deg); background: var(--accent); border: 2px solid #fff; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">A</span><b>Agenda da Cena</b><span class="tag">BANDA</span></div>
  <div class="row" style="flex-wrap:nowrap">
    <span class="pill">rascunho de conceito</span>
    <a class="me-chip" href="#perfil" style="text-decoration:none"><span class="avatar">CC</span></a>
  </div>
</header>

<nav class="tabs" aria-label="Menu">
  <div class="side-only side-brand"><div class="brand"><span class="logo">A</span><b>Agenda da Cena</b><span class="tag">BANDA</span></div></div>
  <a href="#painel" data-tab="painel">
    <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Painel</a>
  <a href="#calendario" data-tab="calendario">

<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // ---------- dados de exemplo (todos fictícios) ----------
  const TODAY = new Date(2026, 9, 16); // sexta, 16/10/2026, igual ao protótipo do público
  const RADIUS = 15;                   // raio do aviso de choque de data, em km

  const BAND = {
    name: 'Céu de Chumbo', initials: 'CC', city: 'Rio de Janeiro · Tijuca', genres: ['doom', 'sludge'],
    since: 2019, approvedBy: 'Coletivo Porão Aberto', approvedAt: '02/09/2026',
    bio: 'Doom arrastado da Zona Norte. Quatro pessoas, dois amplificadores valvulados e muita paciência.',
    links: ['Instagram', 'Bandcamp', 'YouTube'],
  };
  const BASE = [-22.9249, -43.2326]; // Tijuca

  const VENUES = {
    porao:   { name: 'Porão 77', hood: 'Tijuca', addr: 'Rua Conde de Bonfim, 77', ll: [-22.9249, -43.2326] },
    galpao:  { name: 'Galpão Norte', hood: 'São Cristóvão', addr: 'Rua São Luiz Gonzaga, 450', ll: [-22.8995, -43.2219] },
    garagem: { name: 'Garagem 13', hood: 'Lapa', addr: 'Rua do Riachuelo, 13', ll: [-22.9133, -43.1799] },
    casa:    { name: 'Casa Aberta', hood: 'Santa Teresa', addr: 'Rua Almirante Alexandrino, 1200', ll: [-22.9214, -43.1882] },
    esquina: { name: 'Esquina Sonora', hood: 'Botafogo', addr: 'Rua Voluntários da Pátria, 300', ll: [-22.9519, -43.1832] },
    quintal: { name: 'Quintal da Ponte', hood: 'Niterói', addr: 'Rua da Conceição, 210', ll: [-22.8969, -43.1240] },
    praca:   { name: 'Praça do Skate', hood: 'Madureira', addr: 'Estrada do Portela, s/n', ll: [-22.8711, -43.3376] },
    vila:    { name: 'Centro Cultural da Vila', hood: 'Duque de Caxias', addr: 'Av. Presidente Kennedy, 900', ll: [-22.7856, -43.3117] },
  };

  // bandas com perfil aprovado ficam "ligadas": o rolê aparece na agenda delas também
  const LINKED = new Set(['Céu de Chumbo', 'Lodo', 'Ferrugem', 'Mancha Sônica', 'Linha de Frente', 'Estática', 'Noite Eterna', 'Areia Quente', 'Os Esquecidos', 'Fumaça Lenta']);
  const KNOWN_BANDS = [...LINKED, 'Entulho', 'Cão Sarnento', 'Desordem Civil', 'Sem Pátria', 'Nada Feito', 'Ruído Branco', 'Corvo', 'Abismo', 'Vila Rebelde', 'Barulho Local'];

  // agenda da cena (os 8 primeiros são os mesmos do protótipo do público)
  let EVENTS = [
    { id: 1, title: 'Grind na Praça', date: '2026-10-16', time: '19h', venue: 'praca', price: 10, age: 'Livre', lineup: ['Mancha Sônica', 'Entulho', 'Cão Sarnento'] },
    { id: 2, title: 'Doom no Porão', date: '2026-10-17', time: '20h', venue: 'porao', price: 15, age: '18+', lineup: ['Lodo', 'Céu de Chumbo'],
      status: 'local', prevVenue: 'galpao',
      history: [['02/10', 'Evento publicado'], ['14/10', 'Local alterado: Galpão Norte → Porão 77']] },
    { id: 3, title: 'Noite Crust', date: '2026-10-17', time: '21h', venue: 'garagem', price: 20, age: '18+', lineup: ['Ferrugem', 'Desordem Civil', 'Sem Pátria'] },
    { id: 4, title: 'Matinê Stoner', date: '2026-10-18', time: '15h', venue: 'quintal', price: 0, age: 'Livre', lineup: ['Areia Quente', 'Fumaça Lenta'] },
    { id: 5, title: 'Hardcore de Domingo', date: '2026-10-18', time: '17h', venue: 'esquina', price: 15, age: '16+', lineup: ['Linha de Frente', 'Nada Feito'] },
    { id: 6, title: 'Noise na Colina', date: '2026-10-22', time: '20h', venue: 'casa', price: 0, age: 'Livre', lineup: ['Estática', 'Ruído Branco'] },
    { id: 7, title: 'Ritual Black Metal', date: '2026-10-23', time: '20h', venue: 'galpao', price: 25, age: '18+', lineup: ['Noite Eterna', 'Corvo', 'Abismo'] },
    { id: 8, title: 'Punk na Baixada', date: '2026-10-24', time: '18h', venue: 'vila', price: 10, age: 'Livre', lineup: ['Os Esquecidos', 'Vila Rebelde', 'Barulho Local'] },
    { id: 9, title: 'Halloween Podre', date: '2026-10-31', time: '21h', venue: 'garagem', price: 20, age: '18+', lineup: ['Desordem Civil', 'Entulho'] },
    { id: 10, title: 'Crust de Sábado', date: '2026-10-31', time: '20h', venue: 'porao', price: 15, age: '18+', lineup: ['Ferrugem', 'Sem Pátria'] },
    { id: 11, title: 'Gótico na Colina', date: '2026-10-31', time: '22h', venue: 'casa', price: 15, age: '18+', lineup: ['Corvo'] },
    { id: 12, title: 'Thrash Matinê', date: '2026-11-01', time: '16h', venue: 'esquina', price: 10, age: 'Livre', lineup: ['Abismo', 'Nada Feito'] },
    { id: 13, title: 'Sludge & Café', date: '2026-11-07', time: '17h', venue: 'quintal', price: 0, age: 'Livre', lineup: ['Céu de Chumbo', 'Fumaça Lenta'],
      history: [['09/10', 'Evento publicado']] },
    { id: 14, title: 'Feira Punk', date: '2026-11-07', time: '14h', venue: 'vila', price: 0, age: 'Livre', lineup: ['Os Esquecidos', 'Barulho Local'] },
    { id: 15, title: 'Grindcore Fest', date: '2026-11-14', time: '19h', venue: 'galpao', price: 25, age: '18+', lineup: ['Mancha Sônica', 'Cão Sarnento', 'Entulho'] },
    { id: 16, title: 'Hardcore na Praça', date: '2026-11-14', time: '16h', venue: 'praca', price: 0, age: 'Livre', lineup: ['Linha de Frente'] },
    { id: 17, title: 'Noite Doom', date: '2026-11-15', time: '19h', venue: 'porao', price: 15, age: '18+', lineup: ['Lodo'] },
    { id: 18, title: 'Post-rock na Casa', date: '2026-11-20', time: '20h', venue: 'casa', price: 15, age: 'Livre', lineup: ['Estática'] },
    { id: 19, title: 'Oi! na Baixada', date: '2026-11-21', time: '18h', venue: 'vila', price: 10, age: 'Livre', lineup: ['Vila Rebelde'] },
    { id: 20, title: 'Punk de Sábado', date: '2026-11-21', time: '21h', venue: 'garagem', price: 15, age: '18+', lineup: ['Sem Pátria', 'Desordem Civil'] },
    { id: 21, title: 'Stoner Noturno', date: '2026-11-28', time: '20h', venue: 'quintal', price: 15, age: '18+', lineup: ['Areia Quente'] },
    { id: 22, title: 'Fúria HC', date: '2026-11-28', time: '18h', venue: 'esquina', price: 10, age: '16+', lineup: ['Linha de Frente', 'Nada Feito'] },
  ];
  EVENTS.forEach(e => { e.status ||= 'confirmado'; e.history ||= [['—', 'Evento publicado']]; });

  // ---------- utilidades ----------
  const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const pad = n => String(n).padStart(2, '0');
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const daysFrom = s => Math.round((parse(s) - TODAY) / 864e5);
  const fmt = s => { const d = parse(s); return `${WD[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
  const price = p => p ? `R$ ${p}` : 'grátis';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  function km([a, b], [c, d]) {
    const r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
    return 6371 * 2 * Math.asin(Math.sqrt(x));
  }
  const $ = id => document.getElementById(id);
  const app = $('app');
  const isMine = e => e.lineup.includes(BAND.name);
  const live = e => e.status !== 'rascunho' && e.status !== 'cancelado';
  const STATUS = {
    confirmado: { label: 'Confirmado', cls: 'ok' },
    adiado: { label: 'Adiado', cls: 'warn' },
    local: { label: 'Local alterado', cls: 'warn' },
    cancelado: { label: 'Cancelado', cls: 'red' },
    rascunho: { label: 'Rascunho', cls: 'draft' },
  };
  const nowStamp = () => 'agora';

  // rolês que batem com uma data num raio a partir de um ponto
  const clashes = (date, ll, exceptId) => EVENTS
    .filter(e => e.id !== exceptId && e.date === date && live(e))
    .map(e => ({ e, d: km(ll, VENUES[e.venue].ll) }))
    .filter(x => x.d <= RADIUS)
    .sort((a, b) => a.d - b.d);

  // datas próximas com menos rolê perto, puxando pra fim de semana
  function freeDates(date, ll, exceptId) {
    const out = [];
    for (let n = -10; n <= 21; n++) {
      if (!n) continue;
      const d = addDays(date, n);
      if (daysFrom(d) < 1) continue;
      const wd = parse(d).getDay();
      const c = clashes(d, ll, exceptId).length;
      out.push({ d, c, score: c * 10 + Math.abs(n) * .4 + ([5, 6].includes(wd) ? 0 : wd === 0 ? 2 : 6) });
    }
    return out.sort((a, b) => a.score - b.score).slice(0, 3).sort((a, b) => a.d.localeCompare(b.d));
  }

  let toastT;
  function toast(msg) {
    $('toast').textContent = msg;
    $('toast').classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(() => $('toast').classList.remove('on'), 2200);
  }

  function evCard(e) {
    const d = parse(e.date), v = VENUES[e.venue], st = STATUS[e.status];
    return `<a class="ev s-${e.status}" href="#evento-${e.id}">
      <div class="date"><small>${WD[d.getDay()]}</small><b>${d.getDate()}</b></div>
      <div><div class="t">${esc(e.title)} ${e.status !== 'confirmado' ? `<span class="badge ${st.cls}">${st.label}</span>` : ''}</div>
        <div class="w">${esc(v.name)}, ${esc(v.hood)} · ${e.time} · ${price(e.price)}</div></div>
      <svg class="chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    </a>`;
  }

  // ---------- painel ----------
  function viewPainel() {
    const mine = EVENTS.filter(e => isMine(e) && daysFrom(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
    const drafts = mine.filter(e => e.status === 'rascunho');
    const next = mine.filter(e => e.status !== 'rascunho');
    // sextas e sábados das próximas semanas, com quantos rolês já tem perto
    const weekends = [];
    for (let n = 1; n <= 45 && weekends.length < 8; n++) {
      const d = addDays(iso(TODAY), n);
      if ([5, 6].includes(parse(d).getDay())) weekends.push({ d, c: clashes(d, BASE).length });
    }
    app.innerHTML = `
      <div class="kicker">Painel da banda</div>
      <h1>Fala, ${esc(BAND.name)}</h1>
      <p class="sub"><span class="pill ok">✓ perfil aprovado</span> &nbsp;Você publica direto, sem fila.</p>

      <h2>Seus próximos rolês</h2>
      ${next.map(evCard).join('') || '<p class="muted">Nenhum rolê marcado ainda.</p>'}
      ${drafts.length ? `<h2>Rascunhos</h2>${drafts.map(evCard).join('')}` : ''}
      <a class="btn primary" href="#novo" style="margin-top:4px">+ Marcar um rolê</a>

      <h2>Movimento na cena</h2>
      <div class="card">
        <p class="muted" style="margin-bottom:10px">Rolês confirmados num raio de ${RADIUS} km da Tijuca nas próximas sextas e sábados. Toca num dia pra começar um evento nele.</p>
        <div class="free-days">${weekends.map(({ d, c }) => `<button class="pill${c >= 3 ? ' red' : c ? ' warn' : ''}" data-date="${d}">${fmt(d)} · ${c}</button>`).join('')}</div>
      </div>

      <div class="grid-2" style="margin-top:12px">
        <a class="card" href="#calendario" style="text-decoration:none"><b>Ver o calendário da cena →</b><p class="muted">Todos os rolês da região, mês a mês.</p></a>
        <a class="card" href="prototipo.html" target="_blank" rel="noopener" style="text-decoration:none"><b>Ver como o público vê ↗</b><p class="muted">Abre o protótipo da visão de quem vai no rolê.</p></a>
      </div>`;
    app.querySelectorAll('[data-date]').forEach(b => b.onclick = () => startNew(b.dataset.date));
  }

  // ---------- calendário ----------
  let calMonth = 9, calSel = null;
  function viewCalendario() {
    const year = 2026, first = new Date(year, calMonth, 1), days = new Date(year, calMonth + 1, 0).getDate();
    let cells = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < first.getDay(); i++) cells += '<div class="day empty"></div>';
    for (let day = 1; day <= days; day++) {
      const d = iso(new Date(year, calMonth, day));
      const list = EVENTS.filter(e => e.date === d && live(e));
      const n = list.length;
      const heat = !n ? '' : n === 1 ? 'h1' : n === 2 ? 'h2' : 'h3';
      const cls = [heat, list.some(isMine) && 'mine', daysFrom(d) < 0 && 'past', daysFrom(d) === 0 && 'today', calSel === d && 'sel'].filter(Boolean).join(' ');
      cells += `<button class="day ${cls}" data-d="${d}" aria-label="${fmt(d)}, ${n} rolês"><span>${day}</span><span class="dots">${'<i></i>'.repeat(Math.min(n, 4))}</span></button>`;
    }
    const sel = calSel && parse(calSel).getMonth() === calMonth ? calSel : null;
    const selList = sel ? EVENTS.filter(e => e.date === sel && live(e)).map(e => ({ e, d: km(BASE, VENUES[e.venue].ll) })).sort((a, b) => a.d - b.d) : [];
    app.innerHTML = `
      <div class="kicker">Calendário da cena</div>
      <div class="row"><h1>${MONTHS[calMonth]} ${year}</h1>
        <div class="month-nav">
          <button class="icon-btn" id="m-prev" aria-label="Mês anterior" ${calMonth <= 9 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
          <button class="icon-btn" id="m-next" aria-label="Próximo mês" ${calMonth >= 11 ? 'disabled' : ''}><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      </div>
      <p class="sub">Grande Rio · 40 km · <b>${EVENTS.filter(e => parse(e.date).getMonth() === calMonth && live(e)).length} rolês</b> no mês</p>
      <div class="cal-wrap" style="margin-top:14px">
        <div class="card">
          <div class="cal">${cells}</div>
          <div class="legend">
            <span style="--c: var(--card)">livre</span>
            <span style="--c: rgba(230,59,46,.22)">1–2 rolês</span>
            <span style="--c: rgba(230,59,46,.5)">3+ rolês</span>
            <span class="mine-l">sua banda toca</span>
          </div>
        </div>
        <div class="card">
          ${sel ? `
            <div class="row"><b style="font-size:17px">${fmt(sel)}</b><span class="pill ${selList.length >= 3 ? 'red' : selList.length ? 'warn' : 'ok'}">${selList.length ? `${selList.length} ${selList.length === 1 ? 'rolê' : 'rolês'}` : 'livre'}</span></div>
            <div style="margin:6px 0 12px">${selList.map(({ e, d }) => `
              <a class="mini" href="#evento-${e.id}" style="text-decoration:none"><b>${esc(e.title)}${isMine(e) ? ' <span class="badge ok">vocês</span>' : ''}</b><span class="km">${d.toFixed(0)} km</span>
                <span>${esc(VENUES[e.venue].name)}, ${esc(VENUES[e.venue].hood)} · ${e.time}</span><span></span></a>`).join('') || '<p class="muted" style="padding:10px 0">Nenhum rolê marcado na região. Dia bom pra marcar.</p>'}</div>
            ${daysFrom(sel) >= 1 ? `<button class="btn primary" id="mark" style="width:100%">Marcar rolê nesse dia</button>` : ''}`
          : `<p class="muted">Toca num dia pra ver o que já tá marcado e, se quiser, começar um rolê nessa data.</p>`}
        </div>
      </div>`;
    $('m-prev').onclick = () => { calMonth--; viewCalendario(); };
    $('m-next').onclick = () => { calMonth++; viewCalendario(); };
    app.querySelectorAll('.day[data-d]').forEach(b => b.onclick = () => { calSel = b.dataset.d; viewCalendario(); });
    if ($('mark')) $('mark').onclick = () => startNew(sel);
  }

  // ---------- novo evento ----------
  const emptyDraft = () => ({ title: '', date: '', time: '', venue: '', mapOk: false, price: '', free: false, age: '18+', lineup: [BAND.name], flyer: false });
  let draft = emptyDraft();
  let miniMap = null;
  function startNew(date) {
    draft = emptyDraft();
    if (date) draft.date = date;
    location.hash = 'novo';
    if (location.hash === '#novo') viewNovo();
  }

  function viewNovo() {
    app.innerHTML = `
      <div class="kicker">Novo rolê</div>
      <h1>Marcar um rolê</h1>
      <p class="sub">O evento só sai com o básico preenchido. Assim ninguém precisa perguntar na DM.</p>
      <div class="form-wrap" style="margin-top:18px">
        <form class="card" id="f" autocomplete="off" onsubmit="return false">
          <div class="field"><label for="f-title">Nome do rolê <i>*</i></label>
            <input class="input" id="f-title" value="${esc(draft.title)}" placeholder="Ex.: Doom no Porão"></div>
          <div class="two-col">
            <div class="field"><label for="f-date">Data <i>*</i></label>
              <input class="input" id="f-date" type="date" min="${addDays(iso(TODAY), 1)}" max="2026-12-31" value="${draft.date}"></div>
            <div class="field"><label for="f-time">Abertura da casa <i>*</i></label>
              <input class="input" id="f-time" type="time" value="${draft.time}"></div>
          </div>
          <div id="clash-inline"></div>
          <div class="field"><label for="f-venue">Espaço <i>*</i></label>
            <select class="input" id="f-venue">
              <option value="">Escolhe o espaço…</option>
              ${Object.entries(VENUES).map(([k, v]) => `<option value="${k}" ${draft.venue === k ? 'selected' : ''}>${esc(v.name)} · ${esc(v.hood)}</option>`).join('')}
            </select>
            <div id="venue-box"></div>
            <button type="button" class="hint" id="new-venue" style="text-decoration:underline">O espaço não tá na lista?</button>
          </div>
          <div class="two-col">
            <div class="field"><label for="f-price">Entrada <i>*</i></label>
              <input class="input" id="f-price" type="number" min="0" inputmode="numeric" placeholder="R$" value="${draft.price}" ${draft.free ? 'disabled' : ''}>
              <label class="check" style="margin-top:6px"><input type="checkbox" id="f-free" ${draft.free ? 'checked' : ''}> É de graça</label></div>
            <div class="field"><label for="f-age">Classificação</label>
              <select class="input" id="f-age">${['Livre', '16+', '18+'].map(a => `<option ${draft.age === a ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
          </div>
          <div class="field"><label>Line-up <i>*</i></label>
            <div class="lineup-edit" id="lineup"></div>
            <div class="add-row">
              <input class="input" id="f-band" list="bands" placeholder="Adicionar banda…">
              <button type="button" class="btn small" id="add-band">Adicionar</button>
            </div>
            <datalist id="bands">${KNOWN_BANDS.map(b => `<option value="${esc(b)}">`).join('')}</datalist>
            <p class="hint">Bandas com <span class="accent" style="color:var(--accent)">↗</span> têm perfil: o rolê aparece na agenda delas também.</p>
          </div>
          <div class="field"><label>Flyer</label>
            <button type="button" class="flyer-drop" id="f-flyer">${draft.flyer ? '✓ flyer.jpg · trocar' : 'Escolher imagem do flyer'}</button></div>
        </form>

        <div class="side-sticky">
          <div id="clash"></div>
          <div class="card">
            <b>Pra publicar</b>
            <ul class="checklist" id="checklist"></ul>
            <button class="btn primary" id="publish" style="width:100%">Publicar rolê</button>
            <button class="btn" id="save-draft" style="width:100%; margin-top:8px">Salvar rascunho</button>
          </div>
        </div>
      </div>`;

    const bind = (id, key, fn = el => el.value) => $(id).addEventListener('input', ev => { draft[key] = fn(ev.target); refresh(); });
    bind('f-title', 'title');
    bind('f-date', 'date');
    bind('f-time', 'time');
    bind('f-price', 'price');
    bind('f-age', 'age');
    $('f-venue').addEventListener('change', ev => { draft.venue = ev.target.value; draft.mapOk = false; renderVenue(); refresh(); });
    $('f-free').addEventListener('change', ev => { draft.free = ev.target.checked; $('f-price').disabled = draft.free; refresh(); });
    $('new-venue').onclick = () => toast('No app de verdade dá pra cadastrar o endereço e marcar no mapa');
    $('f-flyer').onclick = () => { draft.flyer = true; $('f-flyer').textContent = '✓ flyer.jpg · trocar'; toast('Flyer anexado (simulado)'); };
    const addBand = () => {
      const name = $('f-band').value.trim();
      if (name && !draft.lineup.includes(name)) draft.lineup.push(name);
      $('f-band').value = '';
      renderLineup(); refresh();
    };
    $('add-band').onclick = addBand;
    $('f-band').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addBand(); } });
    $('publish').onclick = () => save('confirmado');
    $('save-draft').onclick = () => save('rascunho');

    renderVenue(); renderLineup(); refresh();
  }

  function renderVenue() {
    if (miniMap) { miniMap.remove(); miniMap = null; }
    const v = VENUES[draft.venue];
    if (!v) { $('venue-box').innerHTML = ''; return; }
    $('venue-box').innerHTML = `
      <div class="minimap" id="minimap"></div>
      <div class="addr">${esc(v.addr)} · ${esc(v.hood)}</div>
      <label class="check" style="margin-top:6px"><input type="checkbox" id="f-map" ${draft.mapOk ? 'checked' : ''}> Confirmei o endereço no mapa</label>`;
    $('f-map').addEventListener('change', ev => { draft.mapOk = ev.target.checked; refresh(); });
    try {
      miniMap = L.map('minimap', { zoomControl: false, attributionControl: true, scrollWheelZoom: false, dragging: false }).setView(v.ll, 15);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: '&copy; Esri, OpenStreetMap' }).addTo(miniMap);
      L.marker(v.ll, { icon: L.divIcon({ className: '', html: '<div class="vpin"></div>', iconSize: [22, 22], iconAnchor: [11, 22] }) }).addTo(miniMap);
    } catch (e) { $('minimap').remove(); }
  }

  function renderLineup() {
    $('lineup').innerHTML = draft.lineup.map((b, i) => `<span class="pill${LINKED.has(b) ? ' linked' : ''}">${esc(b)}${b === BAND.name ? '' : `<button type="button" data-i="${i}" aria-label="Tirar ${esc(b)}">×</button>`}</span>`).join('');
    $('lineup').querySelectorAll('[data-i]').forEach(x => x.onclick = () => { draft.lineup.splice(Number(x.dataset.i), 1); renderLineup(); refresh(); });
  }

  const checks = () => [
    ['Nome do rolê', !!draft.title.trim()],
    ['Data', !!draft.date],
    ['Horário', !!draft.time],
    ['Espaço confirmado no mapa', !!draft.venue && draft.mapOk],
    ['Preço da entrada', draft.free || draft.price !== ''],
    ['Line-up', draft.lineup.length > 0],
  ];

  function refresh() {
    const c = checks();
    $('checklist').innerHTML = c.map(([t, ok]) => `<li class="${ok ? 'done' : ''}">${t}</li>`).join('');
    $('publish').disabled = !c.every(x => x[1]);
    renderClash();
  }

  function renderClash() {
    const boxes = [$('clash'), $('clash-inline')];
    const put = html => boxes.forEach(b => b.innerHTML = html);
    if (!draft.date) { put(''); return; }
    const ll = draft.venue ? VENUES[draft.venue].ll : BASE;
    const where = draft.venue ? `do ${VENUES[draft.venue].name}` : 'da Tijuca';
    const list = clashes(draft.date, ll);
    if (!list.length) {
      put(`<div class="alert ok"><b>✓ ${fmt(draft.date)} tá livre</b><div class="muted" style="font-size:13.5px;margin-top:4px">Nenhum rolê confirmado num raio de ${RADIUS} km ${esc(where)}.</div></div>`);
      return;
    }
    const same = list.some(x => x.e.venue === draft.venue);
    const alts = freeDates(draft.date, ll);
    put(`<div class="alert warn">
      <b>ℹ Já tem ${list.length} ${list.length === 1 ? 'rolê confirmado' : 'rolês confirmados'} num raio de ${RADIUS} km nesse dia</b>
      <ul>${list.map(({ e, d }) => `<li><b>${esc(e.title)}</b> · ${esc(VENUES[e.venue].hood)} · ${e.venue === draft.venue ? 'mesmo espaço' : `${d.toFixed(0)} km`}</li>`).join('')}</ul>
      ${same ? '<div style="font-size:13.5px;margin-bottom:6px"><b style="color:var(--warn)">O espaço já tem evento nessa data.</b> Vale falar com a casa antes.</div>' : ''}
      <div class="muted" style="font-size:12.5px">Pra comparar, outros dias perto:</div>
      <div class="alts">${alts.map(a => `<button type="button" class="pill" data-alt="${a.d}">${fmt(a.d)} · ${a.c ? `${a.c} ${a.c === 1 ? 'rolê' : 'rolês'}` : '0 rolês'}</button>`).join('')}</div>
      <div class="muted" style="font-size:12.5px;margin-top:8px">Só conta evento confirmado, rascunho não reserva data. O aviso não bloqueia: a decisão é sua.</div>
    </div>`);
    document.querySelectorAll('[data-alt]').forEach(b => b.onclick = () => {
      draft.date = b.dataset.alt; $('f-date').value = draft.date; refresh(); toast(`Data trocada pra ${fmt(draft.date)}`);
    });
  }

  function save(status) {
    if (status === 'rascunho' && !draft.title.trim()) { toast('Dá um nome pro rolê antes de salvar'); $('f-title').focus(); return; }
    const id = Math.max(...EVENTS.map(e => e.id)) + 1;
    const e = {
      id, title: draft.title.trim(), date: draft.date || addDays(iso(TODAY), 14), time: draft.time ? draft.time.replace(':00', 'h').replace(':', 'h') : 'a definir',
      venue: draft.venue || 'porao', price: draft.free ? 0 : Number(draft.price) || 0, age: draft.age, lineup: [...draft.lineup],
      status, history: [['agora', status === 'rascunho' ? 'Rascunho salvo' : 'Evento publicado']],
    };
    EVENTS.push(e);
    draft = emptyDraft();
    location.hash = `evento-${id}`;
    if (status === 'rascunho') toast('Rascunho salvo. Só você vê.');
    else {
      const n = e.lineup.filter(b => LINKED.has(b)).length;
      toast(`Publicado! Já aparece pro público e na agenda de ${n} ${n === 1 ? 'banda' : 'bandas'}`);
    }
  }

  // ---------- página do evento (gestão) ----------
  let changing = null;
  function viewEvento(id) {
    const e = EVENTS.find(x => x.id === id);
    if (!e) { location.hash = 'painel'; return; }
    const v = VENUES[e.venue], st = STATUS[e.status], mine = isMine(e);
    const link = `‹nome›/e/${slug(e.title)}`;
    const linked = e.lineup.filter(b => LINKED.has(b));
    const banner = {
      local: `⚠ <span class="mono">LOCAL ALTERADO</span> · agora no ${esc(v.name)}, ${esc(v.hood)}`,
      adiado: `⚠ <span class="mono">ADIADO</span> · nova data: ${fmt(e.date)}${e.prevDate ? ` (era ${fmt(e.prevDate)})` : ''}`,
      cancelado: `✕ <span class="mono">CANCELADO</span> · o rolê não vai mais acontecer`,
    }[e.status];

    app.innerHTML = `
      <a href="#painel" class="muted" style="text-decoration:none;font-size:13px">← Painel</a>
      <div class="row" style="margin:8px 0 14px">
        <div><div class="kicker">${mine ? 'Rolê de vocês' : 'Rolê da cena'}</div><h1>${esc(e.title)}</h1></div>
        <span class="badge ${st.cls}" style="font-size:13px">${st.label}</span>
      </div>
      <div class="grid-2" style="align-items:start">
        <div>
          <div class="card">
            <div class="kicker" style="color:var(--muted)">Como o público vê</div>
            <div class="ev-flyer ${e.status === 'cancelado' ? 'cancelado' : ''}">${esc(e.title)}</div>
            ${banner ? `<div class="status-banner ${e.status === 'cancelado' ? 'red' : 'warn'}">${banner}</div>` : ''}
            <dl class="kv">
              <dt>quando</dt><dd>${e.prevDate && e.status === 'adiado' ? `<s>${fmt(e.prevDate)}</s> ` : ''}${fmt(e.date)} · portas ${e.time}</dd>
              <dt>onde</dt><dd>${e.prevVenue && e.status === 'local' ? `<s>${esc(VENUES[e.prevVenue].name)}</s><br>` : ''}${esc(v.name)} · ${esc(v.addr)}, ${esc(v.hood)}</dd>
              <dt>quanto</dt><dd>${price(e.price)} · ${e.age}</dd>
            </dl>
            <div class="lineup">${e.lineup.map(b => `<span class="pill${LINKED.has(b) ? ' linked' : ''}">${esc(b)}</span>`).join('')}</div>
            ${e.id <= 8 ? `<a class="btn small" style="margin-top:12px" href="prototipo.html#evento-${e.id}" target="_blank" rel="noopener">Abrir na visão do público ↗</a>` : ''}
          </div>
          <p class="hint" style="margin-top:8px">Aparece na agenda de: ${linked.map(esc).join(', ') || 'nenhuma banda com perfil'}.</p>
        </div>

        <div>
          ${mine ? `
          <div class="card">
            <b>Status do rolê</b>
            <p class="hint" style="margin-bottom:10px">Mudou alguma coisa? Atualiza aqui e quem abrir o link vê a versão nova na hora, com aviso em destaque.</p>
            ${e.status === 'rascunho' ? `<button class="btn primary" id="pub-draft" style="width:100%">Publicar agora</button>` : `
            <div class="status-btns">
              ${[['confirmado', 'ok'], ['adiado', 'warn'], ['local', 'warn'], ['cancelado', 'red']].map(([s, c]) =>
                `<button class="${c}${e.status === s ? ' on' : ''}" data-s="${s}">${STATUS[s].label}</button>`).join('')}
            </div>
            <div id="change"></div>`}
          </div>

          <h2>Compartilhar</h2>
          <div class="linkbox"><span>${esc(link)}</span><button class="pill" id="copy">copiar</button></div>
          <div class="wa" aria-label="Prévia do link no WhatsApp">
            <div class="bubble">
              <div class="prev"><div class="img"></div><div><b>${esc(e.title)} · ${fmt(e.date)}</b><small>${esc(v.name)}, ${esc(v.hood)} · ${price(e.price)} · ${e.lineup.map(esc).join(', ')}</small></div></div>
              <span class="url">${esc(link)}</span>
            </div>
          </div>
          <p class="hint">O link já sai com prévia pro WhatsApp e pro Instagram.</p>

          <div class="repost">
            <div class="row" style="margin-bottom:6px"><b>${e.status === 'confirmado' || e.status === 'rascunho' ? 'Texto pronto pro grupo' : 'Aviso pronto pra repostar'}</b><button class="pill" id="copy-text">copiar</button></div>
            <p id="share-text">${shareText(e, v, link)}</p>
          </div>
          <div class="story-row">
            <div class="story ${e.status === 'cancelado' ? 'cancelado' : ''}">
              ${banner ? `<span class="s-tag">${{ local: 'MUDOU O LOCAL', adiado: 'NOVA DATA', cancelado: 'CANCELADO' }[e.status]}</span>` : ''}
              <b>${esc(e.title)}</b><span>${fmt(e.date)} · ${e.time}</span><span>${esc(v.name)}</span><span>${price(e.price)}</span>
            </div>
            <div><b>Arte-base pro story</b><p class="hint">Sai com as informações do evento. Dá pra baixar e colocar o flyer por cima.</p>
              <button class="btn small" id="dl-story" style="margin-top:8px">Baixar arte</button></div>
          </div>
          <p class="hint" style="margin-top:10px">Quem salvou o rolê no calendário recebe as mudanças sozinho.</p>

          <h2>Histórico</h2>
          <ul class="history">${[...e.history].reverse().map(([w, t]) => `<li><span>${w}</span>${esc(t)}</li>`).join('')}</ul>
          ` : `
          <div class="card">
            <p class="muted">Esse rolê é de outra banda. Só quem tá no line-up pode editar.</p>
            <p class="muted" style="margin-top:8px">Viu algo errado? Dá pra <button class="accent" id="report" style="color:var(--accent);text-decoration:underline">denunciar</button> de forma anônima.</p>
          </div>`}
        </div>
      </div>`;

    if ($('copy')) $('copy').onclick = () => toast('Link copiado (simulado)');
    if ($('copy-text')) $('copy-text').onclick = () => toast('Texto copiado (simulado)');
    if ($('dl-story')) $('dl-story').onclick = () => toast('Arte baixada (simulado)');
    if ($('report')) $('report').onclick = () => toast('Denúncia enviada pra quem cuida da comunidade (simulado)');
    if ($('pub-draft')) $('pub-draft').onclick = () => {
      e.status = 'confirmado'; e.history.push([nowStamp(), 'Evento publicado']); viewEvento(id); toast('Publicado!');
    };
    app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { changing = b.dataset.s; renderChange(e); });
    changing = null;
  }

  function shareText(e, v, link) {
    const base = `${esc(e.title)}, ${fmt(e.date)}, portas ${e.time}, no ${esc(v.name)} (${esc(v.hood)}). ${price(e.price)[0].toUpperCase() + price(e.price).slice(1)}, ${e.age}. Line-up: ${e.lineup.map(esc).join(', ')}. Tudo em ${esc(link)}`;
    if (e.status === 'local') return `⚠ <b>MUDOU O LOCAL:</b> ${base}`;
    if (e.status === 'adiado') return `⚠ <b>NOVA DATA:</b> ${base}`;
    if (e.status === 'cancelado') return `✕ <b>CANCELADO:</b> ${esc(e.title)}, que ia rolar ${fmt(e.date)} no ${esc(v.name)}, não vai mais acontecer. Mais em ${esc(link)}`;
    return base;
  }

  function renderChange(e) {
    const box = $('change');
    const done = (msg, hist) => { e.history.push([nowStamp(), hist]); changing = null; viewEvento(e.id); toast(msg); };
    if (changing === 'confirmado') {
      if (e.status === 'confirmado') return;
      e.status = 'confirmado'; e.prevDate = e.prevVenue = null;
      return done('Status: confirmado', 'Marcado como confirmado');
    }
    if (changing === 'cancelado') {
      box.innerHTML = `<div class="change-box"><b>Cancelar o rolê?</b><p class="hint" style="margin:4px 0 10px">A página continua no ar com o aviso de cancelado, pra quem já tinha o link não ir até lá à toa.</p>
        <button class="btn primary small" id="ok-c">Sim, cancelar</button> <button class="btn small" id="no-c">Voltar</button></div>`;
      $('ok-c').onclick = () => { e.status = 'cancelado'; done('Rolê cancelado. Quem abrir o link vai ver o aviso.', 'Cancelado'); };
      $('no-c').onclick = () => { box.innerHTML = ''; };
      return;
    }
    if (changing === 'adiado') {
      box.innerHTML = `<div class="change-box"><label class="hint" for="new-date">Nova data</label>
        <input class="input" type="date" id="new-date" min="${addDays(iso(TODAY), 1)}" max="2026-12-31" style="margin:4px 0 8px">
        <div id="new-date-clash" class="hint"></div>
        <button class="btn primary small" id="ok-a" disabled style="margin-top:8px">Adiar</button></div>`;
      $('new-date').oninput = ev => {
        const d = ev.target.value, n = d ? clashes(d, VENUES[e.venue].ll, e.id).length : 0;
        $('ok-a').disabled = !d;
        $('new-date-clash').innerHTML = !d ? '' : n ? `<span style="color:var(--warn)">⚠ ${n} ${n === 1 ? 'rolê' : 'rolês'} num raio de ${RADIUS} km nesse dia</span>` : '<span style="color:var(--ok)">✓ Dia livre na região</span>';
      };
      $('ok-a').onclick = () => {
        const d = $('new-date').value; if (!d) return;
        e.prevDate = e.date; e.date = d; e.status = 'adiado';
        done(`Adiado pra ${fmt(d)}`, `Adiado: ${fmt(e.prevDate)} → ${fmt(d)}`);
      };
      return;
    }
    if (changing === 'local') {
      box.innerHTML = `<div class="change-box"><label class="hint" for="new-venue-s">Novo espaço</label>
        <select class="input" id="new-venue-s" style="margin:4px 0 8px"><option value="">Escolhe…</option>
        ${Object.entries(VENUES).filter(([k]) => k !== e.venue).map(([k, v]) => `<option value="${k}">${esc(v.name)} · ${esc(v.hood)}</option>`).join('')}</select>
        <button class="btn primary small" id="ok-l" disabled>Trocar local</button></div>`;
      $('new-venue-s').onchange = ev => { $('ok-l').disabled = !ev.target.value; };
      $('ok-l').onclick = () => {
        const nv = $('new-venue-s').value; if (!nv) return;
        e.prevVenue = e.venue; e.venue = nv; e.status = 'local';
        done('Local atualizado. Quem abrir o link vê o endereço novo.', `Local alterado: ${VENUES[e.prevVenue].name} → ${VENUES[nv].name}`);
      };
    }
  }

  // ---------- perfil ----------
  function viewPerfil() {
    const played = new Set();
    EVENTS.filter(isMine).forEach(e => e.lineup.forEach(b => b !== BAND.name && played.add(b)));
    app.innerHTML = `
      <div class="kicker">Perfil da banda</div>
      <div class="profile-head">
        <span class="avatar">${BAND.initials}</span>
        <div><h1>${esc(BAND.name)}</h1><p class="sub">${esc(BAND.city)} · desde ${BAND.since}</p></div>
      </div>
      <div class="card" style="margin:14px 0">
        <span class="pill ok">✓ Perfil aprovado</span>
        <p class="muted" style="margin-top:8px">Aprovado por <b style="color:var(--text)">${esc(BAND.approvedBy)}</b> em ${BAND.approvedAt}. Agora vocês publicam rolê direto, sem fila.</p>
      </div>
      <div class="grid-2">
        <div class="card"><b>Sobre</b><p class="muted" style="margin-top:6px">${esc(BAND.bio)}</p>
          <div class="links" style="margin-top:10px">${BAND.genres.map(g => `<span class="pill">${g}</span>`).join('')}</div></div>
        <div class="card"><b>Links</b>
          <div class="links" style="margin-top:8px">${BAND.links.map(l => `<button class="pill" data-l>${l} ↗</button>`).join('')}</div>
          <b style="display:block;margin-top:14px">Já tocaram junto</b>
          <div class="links" style="margin-top:8px">${[...played].map(b => `<span class="pill">${esc(b)}${LINKED.has(b) ? ' <span style="color:var(--accent)">↗</span>' : ''}</span>`).join('')}</div></div>
      </div>
      <button class="btn" id="edit" style="margin-top:14px">Editar perfil</button>
      <p class="hint" style="margin-top:18px">Fascismo, racismo, LGBTfobia e machismo não entram, nem no perfil nem no line-up. Qualquer pessoa pode denunciar de forma anônima.</p>`;
    $('edit').onclick = () => toast('Edição de perfil (simulado)');
    app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => toast('Abre o link da banda (simulado)'));
  }

  // ---------- rotas ----------
  function route() {
    let [h, query] = (location.hash.slice(1) || 'painel').split('?');
    // link pronto pra demo: #novo?nome=…&data=AAAA-MM-DD&espaco=porao
    if (h === 'novo' && query) {
      const q = new URLSearchParams(query);
      draft = emptyDraft();
      draft.title = q.get('nome') || '';
      draft.date = q.get('data') || '';
      if (VENUES[q.get('espaco')]) { draft.venue = q.get('espaco'); draft.mapOk = true; }
    }
    const ev = h.match(/^evento-(\d+)$/);
    const tab = ev ? '' : h;
    document.querySelectorAll('.tabs a[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
    if (miniMap && h !== 'novo') { miniMap.remove(); miniMap = null; }
    if (ev) viewEvento(Number(ev[1]));
    else if (h === 'calendario') viewCalendario();
    else if (h === 'novo') viewNovo();
    else if (h === 'perfil') viewPerfil();
    else viewPainel();
    scrollTo(0, 0);
  }
  addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
